<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'">
  <title>LAB CORE // AB Engineering</title>
    <link rel="stylesheet" href="css/lab-core.css">
</head>
<body class="grid">
<div class="shell">
  <header class="head">
    <div>
      <div class="eyebrow">AB ENGINEERING · ARCHITECTURE NEXUS</div>
      <h1>LAB CORE</h1>
      <p class="sub">ONE SYSTEM · MANY LABS</p>
    </div>
    <div class="online"><i></i>NETWORK ONLINE</div>
  </header>

  <main class="core">
    <section class="panel network">
      <canvas id="network"></canvas>
      <div class="hub"><div><strong>LAB CORE</strong><small>CONTROL / ROUTING</small></div></div>

      <button class="node n1" data-lab="game">
        <strong>GAME LAB</strong><span>10 engines · AI · systems</span>
      </button>

      <button class="node n2" data-lab="evidence">
        <strong>EVIDENCE LAB</strong><span>appraisal · synthesis</span>
      </button>

      <button class="node n3" data-lab="security">
        <strong>SECURITY LAB</strong><span>identity · protocols</span>
      </button>

      <button class="node n4" data-lab="data">
        <strong>DATA LAB</strong><span>SQL · planning · streams</span>
      </button>

      <button class="node n5" data-lab="devops">
        <strong>DEVOPS LAB</strong><span>CI/CD · pipelines</span>
      </button>

      <button class="node n6" data-lab="systems">
        <strong>SYSTEMS LAB</strong><span>WASM · workers · runtime</span>
      </button>
    </section>

    <aside class="panel side">
      <h2>LAB INSPECTOR</h2>
      <div class="feed" id="feed">
        <div><b>CORE</b> ready</div>
        <div><b>ROUTES</b> 6 registered</div>
        <div><b>STATE</b> listening</div>
      </div>
      <div class="actions">
        <button id="ping">PING NETWORK</button>
        <button id="reset">RESET</button>
      </div>
      <p id="selected" style="color:var(--muted);font-size:12px;margin-top:16px">Velg en node for å inspisere forbindelsen.</p>
    </aside>
  </main>
</div>

<script src="js/lab-core.js" defer></script>
</body>
</html>
