<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'">
  <title>LAB CORE // AB Engineering</title>
  <style>
    :root{--bg:#07040d;--panel:#0f081c;--line:#24143d;--purple:#9333ea;--cyan:#06b6d4;--green:#10b981;--pink:#f43f5e;--text:#f8f7ff;--muted:#94a3b8}
    *{box-sizing:border-box}
    body{margin:0;color:var(--text);font:14px/1.5 system-ui,sans-serif;background:radial-gradient(circle at 50% -5%,#32104f 0,transparent 36%),var(--bg)}
    .grid{min-height:100vh;background-image:linear-gradient(rgba(147,51,234,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(147,51,234,.05) 1px,transparent 1px);background-size:38px 38px}
    .shell{max-width:1250px;margin:auto;padding:30px 18px}
    .head{display:flex;justify-content:space-between;gap:20px;align-items:end;border-bottom:1px solid var(--line);padding-bottom:20px}
    .eyebrow{font-size:11px;letter-spacing:.18em;color:var(--cyan)}
    h1{font-size:clamp(44px,9vw,100px);margin:10px 0 4px;letter-spacing:-.06em;line-height:.9}
    .sub{margin:0;color:var(--muted)}
    .online{font:12px ui-monospace,monospace;color:#c4b5fd}
    .online i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:7px;box-shadow:0 0 15px var(--green)}
    .core{display:grid;grid-template-columns:1.4fr .7fr;gap:18px;margin-top:18px}
    .panel{border:1px solid var(--line);border-radius:18px;background:rgba(15,8,28,.84);box-shadow:0 20px 70px #0006}
    .network{position:relative;min-height:650px;overflow:hidden}
    canvas{position:absolute;inset:0;width:100%;height:100%}
    .hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:180px;height:180px;border-radius:50%;display:grid;place-items:center;text-align:center;background:radial-gradient(circle,#31114f,#13091f 65%);border:2px solid #b26aff;box-shadow:0 0 65px #9333ea66,0 0 120px #06b6d422}
    .hub strong{display:block;font-size:26px}.hub small{color:#c4b5fd;letter-spacing:.14em}
    .node{position:absolute;width:150px;padding:14px;border-radius:14px;border:1px solid #3f2360;background:#0a0610dd;cursor:pointer;transition:.2s}
    .node:hover,.node.active{border-color:#c084fc;transform:translateY(-3px);box-shadow:0 12px 35px #0006}
    .node strong{display:block}.node span{font-size:11px;color:var(--muted)}
    .n1{left:7%;top:12%}.n2{right:7%;top:12%}.n3{left:7%;bottom:12%}.n4{right:7%;bottom:12%}.n5{left:50%;top:8%;transform:translateX(-50%)}.n6{left:50%;bottom:8%;transform:translateX(-50%)}
    .side{padding:18px}.side h2{margin-top:0}.feed{display:grid;gap:8px}.feed div{padding:9px;background:#090611;border:1px solid #1b112a;border-radius:8px;font:11px ui-monospace,monospace}.feed b{color:var(--cyan)}
    .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.actions button{padding:10px 13px;border-radius:9px;border:1px solid var(--line);background:#130b20;color:var(--text);cursor:pointer}.actions button:hover{border-color:var(--purple)}
    @media(max-width:900px){.core{grid-template-columns:1fr}.network{min-height:600px}.node{width:130px}.hub{width:150px;height:150px}}
  </style>
</head>
<body class="grid">
<div class="shell">
  <header class="head">
    <div>
      <div class="eyebrow">AB ENGINEERING · ARCHITECTURE NEXUS</div>
      <h1>LAB CORE</h1>
      <p class="sub">ONE SYSTEM · MANY LABS</p>
    </div>
    <div class="online"><i></i>NETWORK ONLINE</div>
  </header>

  <main class="core">
    <section class="panel network">
      <canvas id="network"></canvas>
      <div class="hub"><div><strong>LAB CORE</strong><small>CONTROL / ROUTING</small></div></div>

      <button class="node n1" data-lab="game">
        <strong>GAME LAB</strong><span>10 engines · AI · systems</span>
      </button>

      <button class="node n2" data-lab="evidence">
        <strong>EVIDENCE LAB</strong><span>appraisal · synthesis</span>
      </button>

      <button class="node n3" data-lab="security">
        <strong>SECURITY LAB</strong><span>identity · protocols</span>
      </button>

      <button class="node n4" data-lab="data">
        <strong>DATA LAB</strong><span>SQL · planning · streams</span>
      </button>

      <button class="node n5" data-lab="devops">
        <strong>DEVOPS LAB</strong><span>CI/CD · pipelines</span>
      </button>

      <button class="node n6" data-lab="systems">
        <strong>SYSTEMS LAB</strong><span>WASM · workers · runtime</span>
      </button>
    </section>

    <aside class="panel side">
      <h2>LAB INSPECTOR</h2>
      <div class="feed" id="feed">
        <div><b>CORE</b> ready</div>
        <div><b>ROUTES</b> 6 registered</div>
        <div><b>STATE</b> listening</div>
      </div>
      <div class="actions">
        <button id="ping">PING NETWORK</button>
        <button id="reset">RESET</button>
      </div>
      <p id="selected" style="color:var(--muted);font-size:12px;margin-top:16px">Velg en node for å inspisere forbindelsen.</p>
    </aside>
  </main>
</div>

<script>
const nodes=[...document.querySelectorAll('.node')];
const feed=document.getElementById('feed');
const selected=document.getElementById('selected');
const labels={
  game:'Interactive engines / Game Lab',
  evidence:'Evidence appraisal / Evidence Lab',
  security:'Identity & protocol simulation / Security Lab',
  data:'SQL / query planning / Data Lab',
  devops:'CI/CD graph / DevOps Lab',
  systems:'WASM / workers / Systems Lab'
};
nodes.forEach(n=>n.addEventListener('click',()=>{
  nodes.forEach(x=>x.classList.remove('active')); n.classList.add('active');
  const key=n.dataset.lab;
  selected.textContent=labels[key];
  const row=document.createElement('div');row.innerHTML='<b>ROUTE</b> '+key.toUpperCase()+' selected';feed.prepend(row);
}));
document.getElementById('ping').onclick=()=>{
  const row=document.createElement('div');row.innerHTML='<b>NETWORK</b> HUB → NODES → ACK';feed.prepend(row);
};
document.getElementById('reset').onclick=()=>{
  nodes.forEach(x=>x.classList.remove('active'));
  selected.textContent='Velg en node for å inspisere forbindelsen.';
  feed.innerHTML='<div><b>CORE</b> ready</div><div><b>ROUTES</b> 6 registered</div><div><b>STATE</b> listening</div>';
};

const canvas=document.getElementById('network'),ctx=canvas.getContext('2d');
function resize(){canvas.width=canvas.clientWidth*devicePixelRatio;canvas.height=canvas.clientHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);draw()}
function draw(){
  const r=canvas.getBoundingClientRect(),cx=r.width/2,cy=r.height/2;
  ctx.clearRect(0,0,r.width,r.height);
  document.querySelectorAll('.node').forEach(n=>{
    const b=n.getBoundingClientRect(),nr=canvas.getBoundingClientRect();
    const x=b.left-nr.left+b.width/2,y=b.top-nr.top+b.height/2;
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(x,y);ctx.strokeStyle='rgba(147,51,234,.42)';ctx.lineWidth=1.2;ctx.stroke();
    ctx.beginPath();ctx.arc(x,y,3,0,Math.PI*2);ctx.fillStyle='#06b6d4';ctx.fill();
  });
  ctx.beginPath();ctx.arc(cx,cy,105,0,Math.PI*2);ctx.strokeStyle='rgba(192,132,252,.12)';ctx.stroke();
}
addEventListener('resize',resize);resize();
</script>
</body>
</html>
